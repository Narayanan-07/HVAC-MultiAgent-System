# ── HVAC Multi-Agent System · full stack ─────────────────────────────────
# Usage:  docker compose up --build
#   Backend  -> http://localhost:8000   (API + /docs)
#   Frontend -> http://localhost:3000   (dashboard)
#
# The processed dataset and generated reports are mounted from the host so the
# image stays small and data survives container rebuilds. Put your API keys in
# .env at the repo root (GROQ_API_KEY, GEMINI_API_KEY).
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./hvac_system.db:/app/hvac_system.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
